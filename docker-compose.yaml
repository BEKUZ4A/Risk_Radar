services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DB_ENGINE: postgres
      DB_NAME: risk_radar
      DB_USER: risk_radar
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      DB_HOST: postgres
      DB_PORT: "5432"
      ALLOWED_HOSTS: "13.60.20.155,${ALLOWED_HOSTS:-localhost,127.0.0.1}"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,${CORS_ALLOWED_ORIGINS:-}"
      CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,${CSRF_TRUSTED_ORIGINS:-}"
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  worker:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DB_ENGINE: postgres
      DB_NAME: risk_radar
      DB_USER: risk_radar
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      DB_HOST: postgres
      DB_PORT: "5432"
      ALLOWED_HOSTS: "13.60.20.155,${ALLOWED_HOSTS:-localhost,127.0.0.1}"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,${CORS_ALLOWED_ORIGINS:-}"
      CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,${CSRF_TRUSTED_ORIGINS:-}"
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config.celery worker --loglevel=info

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: risk_radar
      POSTGRES_USER: risk_radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk_radar -d risk_radar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redisdata:
  postgres_data:
