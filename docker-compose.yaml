services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DB_ENGINE: sqlite
      SQLITE_DB_PATH: /app/data/db.sqlite3
      ALLOWED_HOSTS: "13.60.20.155,${ALLOWED_HOSTS:-localhost,127.0.0.1}"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,${CORS_ALLOWED_ORIGINS:-}"
      CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,${CSRF_TRUSTED_ORIGINS:-}"
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - sqlite_data:/app/data
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  worker:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DB_ENGINE: sqlite
      SQLITE_DB_PATH: /app/data/db.sqlite3
      ALLOWED_HOSTS: "13.60.20.155,${ALLOWED_HOSTS:-localhost,127.0.0.1}"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,${CORS_ALLOWED_ORIGINS:-}"
      CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,${CSRF_TRUSTED_ORIGINS:-}"
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - sqlite_data:/app/data
    command: celery -A config.celery worker --loglevel=info

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

volumes:
  sqlite_data:
  redisdata:
